<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>免佣策略对比看板 v3</title>
<style>
/* scheme A: cold-blue base + semantic diff colors */
:root{
  --bg:#0d1117;
  --surface:#111926;
  --surface-2:#13202e;
  --border:#222b3a;
  --border-soft:#1b2435;
  --text:#c8d8f0;
  --text-sub:#7a90b0;
  --text-mute:#4a5978;
  --accent:#4d8fdb;
  --zy:#4d8fdb;
  --hh:#9b72cf;
  --pos:#3daf72;
  --neg:#d95b5b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC',sans-serif;font-size:13px}
.hd{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.hd h1{font-size:16px;font-weight:600;color:var(--text);letter-spacing:.2px}
.hd .sub{font-size:11px;color:var(--text-sub);margin-top:3px;line-height:1.5}
.hd-r{font-size:11px;color:var(--text-sub);background:transparent;border:1px solid var(--border);border-radius:4px;padding:3px 10px}
.ctrl{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ci{display:flex;align-items:center;gap:5px;font-size:12px}
.ci label{color:var(--text-sub);white-space:nowrap}
.ci input,.ci select{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:4px 8px;font-size:12px;outline:none}
.ci select{min-width:80px}
.mode-grp{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.mode-btn{background:var(--surface-2);border:none;color:var(--text-sub);cursor:pointer;font-size:11px;padding:4px 10px;transition:background .15s,color .15s}
.mode-btn.active{background:var(--accent);color:#fff}
.mode-btn:hover:not(.active){background:#222a3b;color:var(--text)}
.btn{background:var(--accent);border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:12px;font-weight:500;padding:5px 14px}
.btn:hover{filter:brightness(1.08)}
.ccnt{font-size:11px;color:var(--text-mute);margin-left:auto}
.content{padding:16px 20px}
.th-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.th-title{font-size:13px;font-weight:500;color:var(--text)}
.th-desc{font-size:11px;color:var(--text-mute)}
.tw{overflow-x:auto;border-radius:6px;border:1px solid var(--border-soft)}
table{border-collapse:collapse;width:100%;min-width:800px}
thead tr.wh th{background:#13171f;padding:7px 4px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:12px;font-weight:500;color:var(--text)}
thead tr.wh th.fix{color:var(--text-mute);font-weight:500}
thead tr.sh th{background:#0f1a28;padding:5px 4px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border-soft);font-size:11px;font-weight:500;color:var(--text-sub)}
thead tr.sh th.zy{color:var(--zy)}
thead tr.sh th.hh{color:var(--hh)}
thead tr.sh th.df{color:var(--text-mute)}
tbody tr{border-bottom:1px solid var(--border-soft)}
tbody tr:hover td{background:rgba(77,143,219,.05)}
td{padding:5px 5px;border-right:1px solid var(--border-soft);vertical-align:middle;font-size:11px;line-height:1.4;color:#a8bcd8}
td.tc{font-size:12px;font-weight:500;color:var(--text);background:#111926;text-align:center;vertical-align:middle;min-width:60px}
td.tw2{color:var(--text-mute);text-align:center;background:#0f1624;white-space:nowrap;min-width:38px}
tr.rs td{background:#131c2e}
tr.rs td.tc{background:#182240}
tr.rs td.tw2{background:#182240;color:#8ba0be;font-weight:500}
td.ts{text-align:center;white-space:pre-line;word-break:break-all;min-width:80px;padding:4px 5px;color:#b0c8e8}
td.ts.zy{color:#8bb8e8}
td.ts.hh{color:#b89ae0}
td.ts.pos{color:var(--pos);font-weight:600}
td.ts.neg{color:var(--neg);font-weight:600}
td.ts.eq{color:var(--text-mute)}
td.ts.nd{color:#2a3548}
td.gp{background:#0a0f18;border-right:1px solid #1e2a3a;width:4px;padding:0}
.empty{text-align:center;padding:50px;color:var(--text-mute);font-size:13px}
/* multi-select dropdown */
.msel-wrap{position:relative;display:inline-block}
.msel-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:4px 22px 4px 8px;font-size:12px;cursor:pointer;white-space:nowrap;min-width:110px;max-width:240px;overflow:hidden;text-overflow:ellipsis;text-align:left;position:relative}
.msel-btn::after{content:'\25BE';position:absolute;right:7px;top:50%;transform:translateY(-50%);color:var(--text-mute);font-size:10px}
.msel-panel{display:none;position:absolute;top:calc(100% + 2px);left:0;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;z-index:999;min-width:180px;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.msel-panel.open{display:block}
.msel-search{width:100%;background:#101420;border:none;border-bottom:1px solid var(--border);color:var(--text);padding:6px 8px;font-size:12px;outline:none;box-sizing:border-box}
.msel-list{max-height:240px;overflow-y:auto;padding:2px 0}
.msel-item{display:flex;align-items:center;gap:6px;padding:4px 8px;cursor:pointer;font-size:12px;color:var(--text)}
.msel-item:hover{background:#222a3b}
.msel-item input{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.msel-all{border-bottom:1px solid var(--border);color:var(--text-sub);background:#13171f}
.tier-pill{font-size:9px;padding:1px 5px;border-radius:3px;white-space:nowrap}
.tier-core{background:#1e3050;color:#5b9bf0;border:1px solid #2a4570}
.tier-gl{background:#1a3028;color:#4caf7a;border:1px solid #234530}
.tier-gs{background:#162a20;color:#3d9060;border:1px solid #1e3828}
.tier-sc{background:#2e1a1a;color:#d95b5b;border:1px solid #4a2222}
.tier-ot{background:#1a1f2e;color:#5a6880;border:1px solid #252e42}
</style>
</head>
<body>
<div class="hd">
  <div>
    <h1>免佣策略对比看板</h1>
    <div class="sub">数据集 756953 · 仅免佣奖 · 已剔除：全天免佣（00:00-23:59）/ 仅含订单类型3 / 仅含订单类型4</div>
  </div>
  <div class="hd-r" id="ds">加载中</div>
</div>
<div class="ctrl">
  <div class="ci"><label>基准周</label><input type="date" id="bw"></div>
  <div class="ci"><label>分框</label>
    <select id="tier-sel" onchange="render()">
      <option value="">全部</option>
      <option>核心城市</option>
      <option>行业增长-大</option>
      <option>行业增长-小</option>
      <option>战略收缩城市</option>
      <option>其他</option>
    </select>
  </div>
  <div class="ci"><label>城市</label>
    <div class="msel-wrap">
      <button type="button" class="msel-btn" id="city-btn" onclick="togglePanel('city-panel',event)">全部城市</button>
      <div class="msel-panel" id="city-panel">
        <input class="msel-search" id="city-search" placeholder="搜索城市…" oninput="filterCityList()">
        <div class="msel-list" id="city-list"></div>
      </div>
    </div>
  </div>
  <div class="ci"><label>周几</label>
    <div class="msel-wrap">
      <button type="button" class="msel-btn" id="wd-btn" onclick="togglePanel('wd-panel',event)">全部周几</button>
      <div class="msel-panel" id="wd-panel"><div class="msel-list" id="wd-list"></div></div>
    </div>
  </div>
  <div class="ci"><label>展示</label>
    <div class="mode-grp">
      <button class="mode-btn" id="m0" onclick="setMode(0)">仅时长</button>
      <button class="mode-btn active" id="m1" onclick="setMode(1)">仅时段</button>
      <button class="mode-btn" id="m2" onclick="setMode(2)">时长+时段</button>
    </div>
  </div>
  <button class="btn" onclick="render()">刷新</button>
  <span class="ccnt" id="cc"></span>
</div>
<div class="content">
  <div class="th-row">
    <div class="th-title">三方时长对比 · 最近 4 周</div>
    <div class="th-desc" id="wr"></div>
  </div>
  <div class="tw" id="tw"><div class="empty">初始化…</div></div>
</div>
<script>

const WD=['周一','周二','周三','周四','周五','周六','周日'];
let MODE=1;
// city completion-order rank + tier (injected at file end from Excel)
let CITY_RANK={}, CITY_TIER={};
// selected sets; empty = all
let selCities=new Set();
let selWds=new Set();

function togglePanel(id,ev){
  if(ev)ev.stopPropagation();
  const p=document.getElementById(id);
  document.querySelectorAll('.msel-panel').forEach(el=>{if(el.id!==id)el.classList.remove('open');});
  p.classList.toggle('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.msel-wrap'))document.querySelectorAll('.msel-panel').forEach(el=>el.classList.remove('open'));
});
function updateCityBtn(){
  const b=document.getElementById('city-btn');
  b.textContent=selCities.size===0?'全部城市':(selCities.size===1?[...selCities][0]:selCities.size+'个城市');
}
function updateWdBtn(){
  const b=document.getElementById('wd-btn');
  b.textContent=selWds.size===0?'全部周几':[...selWds].sort((a,b)=>a-b).map(i=>WD[i]).join('/');
}
function filterCityList(){
  const q=document.getElementById('city-search').value.trim();
  document.querySelectorAll('#city-list .msel-item[data-city]').forEach(el=>{
    el.style.display=el.dataset.city.includes(q)?'':'none';
  });
}
function buildCityList(cities){
  const list=document.getElementById('city-list');
  list.innerHTML='';
  const all=document.createElement('div');
  all.className='msel-item msel-all';
  all.innerHTML='<input type="checkbox" id="ca"><span style="flex:1">全选 / 取消</span>';
  all.querySelector('input').addEventListener('change',e=>{
    if(e.target.checked){selCities=new Set(cities);}else{selCities=new Set();}
    document.querySelectorAll('#city-list .city-cb').forEach(cb=>cb.checked=e.target.checked);
    updateCityBtn();render();
  });
  list.appendChild(all);
  for(const c of cities){
    const it=document.createElement('div');
    it.className='msel-item';it.dataset.city=c;
    const tier=CITY_TIER[c]||'其他';
    it.innerHTML='<input type="checkbox" class="city-cb" data-city="'+c+'"><span style="flex:1">'+c+'</span><span class="tier-pill">'+tier+'</span>';
    const tc2={'核心城市':'tier-core','行业增长-大':'tier-gl','行业增长-小':'tier-gs','战略收缩城市':'tier-sc'}[tier]||'tier-ot';
    it.querySelector('.tier-pill').className='tier-pill '+tc2;
    it.querySelector('input').addEventListener('change',e=>{
      if(e.target.checked)selCities.add(c);else selCities.delete(c);
      updateCityBtn();render();
    });
    list.appendChild(it);
  }
}
function buildWdList(){
  const list=document.getElementById('wd-list');
  list.innerHTML='';
  WD.forEach((w,i)=>{
    const it=document.createElement('div');
    it.className='msel-item';
    it.innerHTML='<input type="checkbox" class="wd-cb" data-wi="'+i+'"><span>'+w+'</span>';
    it.querySelector('input').addEventListener('change',e=>{
      if(e.target.checked)selWds.add(i);else selWds.delete(i);
      updateWdBtn();render();
    });
    list.appendChild(it);
  });
}

function setMode(m){
  MODE=m;
  ['m0','m1','m2'].forEach((id,i)=>document.getElementById(id).className='mode-btn'+(i===m?' active':''));
  render();
}

// === 本地日期工具（避免UTC偏移） ===
// 将 YYYY-MM-DD 解析为本地 Date
function parseD(s){
  const p=s.split('-');
  return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
}
// Date -> YYYY-MM-DD (本地)
function fmtYMD(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
// 日期所在周的周一 (周一=1...周日=7, 本地)
function getMon(s){
  const d=parseD(s);
  const wd=d.getDay(); // 0=Sun
  const diff=wd===0?-6:1-wd;
  d.setDate(d.getDate()+diff);
  return fmtYMD(d);
}
// 日期加n天
function addD(s,n){
  const d=parseD(s);
  d.setDate(d.getDate()+n);
  return fmtYMD(d);
}
// MM-DD
function fmtD(s){return s.slice(5);}

// === 时段解析 ===
function toMin(s){
  const p=s.trim().split(':');
  const h=parseInt(p[0]||0),m=parseInt(p[1]||0);
  return h*60+(m>=50?60:m);
}
function parseSegs(raw){
  if(!raw||!raw.trim())return[];
  const segs=[];
  for(const seg of raw.split(',')){
    const m=seg.trim().match(/(\d{1,2}:\d{2})(?::\d{2})?\s*[-~_]\s*(\d{1,2}:\d{2})(?::\d{2})?/);
    if(!m)continue;
    const sm=toMin(m[1]),em=toMin(m[2]);
    if(em>sm)segs.push({s:m[1],e:m[2],mins:em-sm});
  }
  return segs;
}
function fmtH(mins){
  if(!mins)return'';
  return Math.round(mins/60)+'h';
}

// === dataMap ===
// 数据已在SQL层过滤(全天/仅3/仅4), 此处直接构建
// key = city|weekMon|weekdayIdx|supplier
let allCities=[],dataMap={};

function buildMap(rows){
  dataMap={};
  const cs=new Set();
  for(const[city,sup,dStart,dEnd,dr] of rows){
    cs.add(city);
    // Expand multi-day activities: fill every day from dStart to dEnd
    const end=parseD(dEnd);
    let cur=parseD(dStart);
    while(cur<=end){
      const date=fmtYMD(cur);
      const weekMon=getMon(date);
      const wd=cur.getDay();
      const wi=wd===0?6:wd-1;
      const key=city+'|'+weekMon+'|'+wi+'|'+sup;
      if(!dataMap[key])dataMap[key]=[];
      dataMap[key].push(dr);
      cur.setDate(cur.getDate()+1);
    }
  }
  // sort by Excel rank; unranked cities fall back to pinyin order
  allCities=Array.from(cs).sort((a,b)=>{
    const ra=CITY_RANK[a]||9999,rb=CITY_RANK[b]||9999;
    if(ra!==rb)return ra-rb;
    return a.localeCompare(b,'zh');
  });
}

function getSegs(city,weekMon,wi,sup){
  const arr=dataMap[city+'|'+weekMon+'|'+wi+'|'+sup];
  if(!arr||!arr.length)return[];
  const all=[];
  for(const r of [...new Set(arr)])
    for(const s of parseSegs(r))all.push(s);
  const seen=new Set();
  return all.filter(s=>{const k=s.s+'-'+s.e;if(seen.has(k))return false;seen.add(k);return true;});
}
function getMins(city,weekMon,wi,sup){
  return getSegs(city,weekMon,wi,sup).reduce((t,s)=>t+s.mins,0);
}
function cellText(city,weekMon,wi,sup){
  const segs=getSegs(city,weekMon,wi,sup);
  if(!segs.length)return'';
  const tot=segs.reduce((t,s)=>t+s.mins,0);
  if(MODE===0)return fmtH(tot);
  const slots=segs.map(s=>s.s+'-'+s.e).join(' ');
  if(MODE===1)return slots;
  return slots+' '+fmtH(tot);
}

// 由近到远: [当周, 上周, 上上周, 上上上周]
function getWeeks(base){
  const wks=[];
  for(let i=0;i<4;i++){
    const mon=addD(base,-i*7);
    wks.push({mon,sun:addD(mon,6)});
  }
  return wks;
}

function render(){
  const bwVal=document.getElementById('bw').value;
  const base=getMon(bwVal||fmtYMD(new Date()));
  const weeks=getWeeks(base);

  const fTier=document.getElementById('tier-sel').value;
  let cities=allCities;
  if(fTier)cities=cities.filter(c=>(CITY_TIER[c]||'其他')===fTier);
  if(selCities.size>0)cities=cities.filter(c=>selCities.has(c));

  document.getElementById('cc').textContent='共'+cities.length+'城';
  document.getElementById('wr').textContent=
    '当周 '+fmtD(weeks[0].mon)+'~'+fmtD(weeks[0].sun)+'，向前展示 4 周';

  let h='<table><colgroup><col style="width:62px"><col style="width:38px">';
  // extra col for 分框
  h='<table><colgroup><col style="width:62px"><col style="width:54px"><col style="width:38px">';
  for(let w=0;w<4;w++){
    h+='<col style="min-width:95px"><col style="min-width:95px"><col style="min-width:65px">';
    if(w<3)h+='<col style="width:3px">';
  }
  h+='</colgroup><thead><tr class="wh">';
  h+='<th class="fix" rowspan="2">城市</th><th class="fix" rowspan="2">分框</th><th class="fix" rowspan="2">周几</th>';
  for(let w=0;w<4;w++){
    const label=w===0?'当周':(w===1?'上周':(w===2?'上上周':'上上上周'));
    h+='<th colspan="3">'+label+'<br><span style="font-size:10px;font-weight:400;opacity:.8">'+
       fmtD(weeks[w].mon)+'~'+fmtD(weeks[w].sun)+'</span></th>';
    if(w<3)h+='<th rowspan="2" style="background:#0e1220;border:none;padding:0"></th>';
  }
  h+='</tr><tr class="sh">';
  for(let w=0;w<4;w++){
    h+='<th class="zy">自营</th><th class="hh">宏鹄</th><th class="df">自营-宏鹄</th>';
  }
  h+='</tr></thead><tbody>';

  if(!cities.length){h+='<tr><td colspan="27" class="empty">无匹配城市</td></tr>';}

  for(const city of cities){
    const wdList=selWds.size>0?[...selWds].sort((a,b)=>a-b):WD.map((_,i)=>i);
    const showSummary=selWds.size===0;
    const rs=wdList.length+(showSummary?1:0);
    const tier=CITY_TIER[city]||'';
    const tierCls={'核心城市':'tier-core','行业增长-大':'tier-gl','行业增长-小':'tier-gs','战略收缩城市':'tier-sc'}[tier]||'tier-ot';

    for(let ri=0;ri<wdList.length;ri++){
      const wi=wdList[ri];
      h+='<tr>';
      if(ri===0){
        h+='<td class="tc" rowspan="'+rs+'">'+city+'</td>';
        h+='<td class="tw2" rowspan="'+rs+'" style="background:#0f1624"><span class="tier-pill '+tierCls+'">'+tier+'</span></td>';
      }
      h+='<td class="tw2">'+WD[wi]+'</td>';

      for(let w=0;w<4;w++){
        const weekMon=weeks[w].mon;
        const zyT=cellText(city,weekMon,wi,'自营');
        const hhT=cellText(city,weekMon,wi,'宏鹄');
        const zyM=getMins(city,weekMon,wi,'自营');
        const hhM=getMins(city,weekMon,wi,'宏鹄');
        const diff=zyM-hhM;

        h+='<td class="ts'+(zyM?' zy':' nd')+'">'+(zyT||'—')+'</td>';
        h+='<td class="ts'+(hhM?' hh':' nd')+'">'+(hhT||'—')+'</td>';

        let dc,dt;
        if(!zyM&&!hhM){dc='nd';dt='—';}
        else if(diff>0){dc='pos';dt='+'+fmtH(diff);}
        else if(diff<0){dc='neg';dt='-'+fmtH(-diff);}
        else{dc='eq';dt='0';}
        h+='<td class="ts '+dc+'">'+dt+'</td>';
        if(w<3)h+='<td class="gp"></td>';
      }
      h+='</tr>';
    }

    if(showSummary){
      h+='<tr class="rs"><td class="tw2">全周</td>';
      for(let w=0;w<4;w++){
        const weekMon=weeks[w].mon;
        let tz=0,th=0;
        for(let i=0;i<7;i++){tz+=getMins(city,weekMon,i,'自营');th+=getMins(city,weekMon,i,'宏鹄');}
        const diff=tz-th;
        h+='<td class="ts'+(tz?' zy':' nd')+'" style="font-size:10px">'+(tz?fmtH(tz):'—')+'</td>';
        h+='<td class="ts'+(th?' hh':' nd')+'" style="font-size:10px">'+(th?fmtH(th):'—')+'</td>';
        let dc,dt;
        if(!tz&&!th){dc='nd';dt='—';}
        else if(diff>0){dc='pos';dt='+'+fmtH(diff);}
        else if(diff<0){dc='neg';dt='-'+fmtH(-diff);}
        else{dc='eq';dt='0';}
        h+='<td class="ts '+dc+'" style="font-size:10px">'+dt+'</td>';
        if(w<3)h+='<td class="gp"></td>';
      }
      h+='</tr>';
    }
  }
  h+='</tbody></table>';
  document.getElementById('tw').innerHTML=h;
}

function init(){
  buildMap(EMBEDDED_DATA);
  buildCityList(allCities);
  buildWdList();
  // 默认基准周：今天所在周
  document.getElementById('bw').value=fmtYMD(new Date());
  document.getElementById('ds').textContent='数据日期 2026-06-23 · '+allCities.length+' 城';
  // 默认分框=核心城市，避免一次渲染全部城市卡顿
